#! clean build -dtSa "-O2 -fPIC" -p test -l -pthread

name: mkn.ram

parent: lib

profile:
- name: base
  inc: inc
  src: src/any
  if_src:
    bsd: src/nixish
    nix: src/nixish
    win: src/win

- name: lib
  parent: base
  dep: mkn.kul
  if_arg:
    win_shared: -DMKN_KUL_SHARED -DMKN_KUL_EXPORT

- name: https
  parent: lib
  arg: -DMKN_RAM_INCLUDE_HTTPS
  if_mod:
    win:
    - name: conan.install
      init:
        install: -s compiler="msvc"
  if_lib:
    nix: ssl crypto
    bsd: ssl crypto
    win: User32 Crypt32 libssl libcrypto zlib
  if_link:
    win_cl: -nodefaultlib:libucrt.lib ucrt.lib

- name: usage
  parent: https
  main: tst/usage.cpp
  # arg: -DMKN_RAM_INCLUDE_HTTPS
  # if_link:
  #   win_cl: -nodefaultlib:libucrt.lib ucrt.lib

- name: test
  parent: https
  main: tst/test.cpp
  src: tst/test

# FastCGI server behind nginx, see res/test/nginx.sh
- name: test.fcgi.serve
  parent: lib
  main: tst/fcgi/serve.cpp

- name: test.client
  parent: lib
  main: tst/client.cpp

- name: test.server
  parent: lib
  main: tst/server.cpp

- name: format
  mod:
  - name: clang.format
    init:
      style: file
      types: cpp cxx cc h hpp
      paths: .
      args:  -DMKN_RAM_INCLUDE_HTTPS

# include-what-you-use report for inc/ and src/, needs iwyu on PATH, see res/iwyu.imp
- name: iwyu
  parent: https
  mod:
  - name: cpp.iwyu
    compile:
      paths: inc
      # os/win: other platform, os/nixish: fragments of tcp/http/https.hpp
      # mpi needs its library
      ignore: os/win src/win os/nixish mpi
      headers: -x c++-header
      args: -Xiwyu --mapping_file=res/iwyu.imp

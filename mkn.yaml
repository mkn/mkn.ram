#! clean build -dtSa "-O2 -fPIC" -p test -l -pthread

name: mkn.ram

parent: lib

profile:
- name: base
  inc: inc
  src: src/any
  if_src:
    bsd: src/nixish
    nix: src/nixish
    win: src/win

- name: lib
  parent: base
  dep: mkn.kul
  if_arg:
    win_shared: -DKUL_SHARED -DKUL_EXPORT

- name: https
  parent: lib
  arg: -D_MKN_RAM_INCLUDE_HTTPS_
  if_mod:
    win:
    - name: conan.install
      init:
        install: -s compiler="msvc"
  if_lib:
    nix: ssl crypto
    bsd: ssl crypto
    win: User32 Crypt32 libssl libcrypto zlib
  if_link:
    win_cl: -nodefaultlib:libucrt.lib ucrt.lib

- name: fcgi
  parent: lib
  arg: -D_KUL_INCLUDE_FCGI_

- name: usage
  parent: https
  main: tst/usage.cpp
  # arg: -D_MKN_RAM_INCLUDE_HTTPS_
  # if_link:
  #   win_cl: -nodefaultlib:libucrt.lib ucrt.lib

- name: test_fcgi
  main: tst/fcgi.cpp
  self: fcgi

- name: test
  parent: https
  mode: none
  main: tst/test.cpp

- name: test.client
  parent: lib
  main: tst/client.cpp

- name: test.server
  parent: lib
  main: tst/server.cpp

- name: format
  mod:
  - name: clang.format
    init:
      style: file
      types: cpp cxx cc h hpp
      paths: .
      args:  -D_MKN_RAM_INCLUDE_HTTPS_

name: release

# Release binaries: every PR into master or latest builds them (mkn's manifest command collects each
#  build into .mkn/manifest/), a PR merged into latest publishes them as mkn.yaml's version: that tag, a
#  GitHub release marked latest, mkn.manifest.yml (every platform's merged).
#  Dependency versions left as `latest` (property <dep>.version: latest) are pinned to the dependency's
#  newest release tag (res/ci/pin.sh) in every build and in a commit on top of the merge commit, which gets
#  the tag; the latest branch keeps `latest`. A pre-release version (e.g. 0.1.0-beta.1) publishes a GitHub
#  pre-release, never marked latest. Run by hand it only builds.
#  Profiles: @ (top level) everywhere, https2 (with https) on POSIX, each static and shared.

on:
  pull_request:
    branches: [ master, latest ]
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' }}
  cancel-in-progress: true

env:
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/download/latest
  ARGS: -std=c++20 -fPIC -O2 -DNDEBUG  # explicit: mkn's -O adds -march=native
  # a merged PR builds its merge commit, an open one GitHub's merge of it
  REF: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}
  PUBLISH: ${{ github.event.action == 'closed' && github.event.pull_request.merged && github.base_ref == 'latest' }}

jobs:
  pins:
    if: github.event.action != 'closed' || (github.event.pull_request.merged && github.base_ref == 'latest')
    runs-on: ubuntu-latest
    outputs:
      pins: ${{ steps.pins.outputs.pins }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - id: pins
      run: |
        if [ "$PUBLISH" = true ]; then
          version=$(yq '.version' mkn.yaml)
          if [ -z "$version" ] || [ "$version" = null ] || [ "$version" = master ]; then
            echo "mkn.yaml version must be a release on latest, not '$version'"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "tag $version exists, bump mkn.yaml version"; exit 1
          fi
        fi
        pins=$(res/ci/pin.sh resolve)
        echo "$pins"
        { echo "pins<<EOF"; echo "$pins"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  linux:
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        include:
        - { runner: ubuntu-22.04, image: "quay.io/pypa/manylinux_2_28_x86_64", mkn: mkn_manylinux, arch: x86_64 }
        - { runner: ubuntu-26.04-arm, image: "quay.io/pypa/manylinux_2_28_aarch64", mkn: mkn_manylinux_arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      PINS: ${{ needs.pins.outputs.pins }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - run: |
        set -ex
        dnf install -y epel-release && dnf install -y openssl3-devel  # OpenSSL 3, the system one is 1.1.1
        res/ci/pin.sh apply
        $CURL_GET -o mkn ${PATH_GET}/${{ matrix.mkn }} && chmod +x mkn
        SSL="-b /usr/include/openssl3 -B /usr/lib64/openssl3"
        for p in @ https2; do for m in -K -S; do
          ./mkn clean build manifest -dt $m -p $p -a "$ARGS" -g 0 $SSL
        done; done
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: nix-${{ matrix.arch }}
        path: .mkn/manifest
        include-hidden-files: true  # .mkn/
        retention-days: 3

  macos:
    needs: pins
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      PINS: ${{ needs.pins.outputs.pins }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - run: |
        set -ex
        res/ci/pin.sh apply
        $CURL_GET -o mkn ${PATH_GET}/mkn_arm_osx && chmod +x mkn
        SSL_DIR=$(brew --prefix openssl@3)  # stable opt/ path, not the versioned Cellar one
        for p in @ https2; do for m in -K -S; do
          ./mkn clean build manifest -dt $m -p $p -a "$ARGS" -g 0 -b "$SSL_DIR/include" -B "$SSL_DIR/lib"
        done; done
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: bsd-arm64
        path: .mkn/manifest
        include-hidden-files: true  # .mkn/
        retention-days: 3

  windows:
    needs: pins
    runs-on: windows-latest
    env:
      PINS: ${{ needs.pins.outputs.pins }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
    - shell: bash
      env:
        MKN_CL_PREFERRED: 1
      run: |
        set -ex
        rm -f /usr/bin/link /bin/link  # Git's link interferes with cl's link.exe
        res/ci/pin.sh apply
        $CURL_GET -o mkn.exe ${PATH_GET}/mkn.exe
        WARGS="-EHsc -std:c++20 -O2 -DNDEBUG -MD"
        for m in -K -S; do  # https2 is POSIX only
          ./mkn clean build manifest -dt $m -a "$WARGS" -g 0
        done
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: win-x86_64
        path: .mkn/manifest
        include-hidden-files: true  # .mkn/
        retention-days: 3

  publish:
    needs: [ pins, linux, macos, windows ]
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.base_ref == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PINS: ${{ needs.pins.outputs.pins }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - uses: actions/download-artifact@v5
      with:
        path: dist  # a directory per platform, each with its mkn.manifest.yml
    - id: version
      run: |
        set -euo pipefail
        version=$(yq '.version' mkn.yaml)
        res/ci/pin.sh apply
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -qam "$version: dependency versions pinned" || true
        git tag -a "$version" -m "$version"
        git push origin "refs/tags/$version"
        mkdir release
        find dist -type f ! -name mkn.manifest.yml -exec cp {} release/ \;  # the libraries
        COMMIT=$(git rev-parse HEAD) yq ea '. as $i ireduce ({}; . * $i) | .commit = strenv(COMMIT)' \
          dist/*/mkn.manifest.yml > release/mkn.manifest.yml
        echo "version=$version" >> "$GITHUB_OUTPUT"
        case "$version" in *-*) echo "prerelease=true";; *) echo "prerelease=false";; esac >> "$GITHUB_OUTPUT"
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        prerelease: ${{ steps.version.outputs.prerelease }}
        make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
        files: release/*
